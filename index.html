<script>
  // --- Shim de almacenamiento persistente usando localStorage del propio dispositivo ---
  // Implementa la misma interfaz que window.storage usa dentro de la app (get/set/delete/list)
  function storageKey(key, shared) { return "sushi:" + (shared ? "shared" : "me") + ":" + key; }
  window.storage = {
    get: async function (key, shared) {
      const raw = localStorage.getItem(storageKey(key, shared));
      if (raw === null) return null;
      return { key: key, value: raw, shared: !!shared };
    },
    set: async function (key, value, shared) {
      localStorage.setItem(storageKey(key, shared), value);
      return { key: key, value: value, shared: !!shared };
    },
    delete: async function (key, shared) {
      localStorage.removeItem(storageKey(key, shared));
      return { key: key, deleted: true, shared: !!shared };
    },
    list: async function (prefix, shared) {
      const p = storageKey(prefix || "", shared);
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(p) === 0) keys.push(k.slice(("sushi:" + (shared ? "shared" : "me") + ":").length));
      }
      return { keys: keys, prefix: prefix, shared: !!shared };
    }
  };

  // Solicita almacenamiento persistente cuando el navegador lo permite.
  // En la APK, localStorage vive dentro de los datos privados de la aplicación.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (e) { console.warn("SW no registrado", e); });
    });
  }
</script>

@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

.sc-root {
  --washi: #F3EAD8;
  --washi-2: #EBDFC7;
  --sumi: #221E1A;
  --shu: #C1402A;
  --shu-dark: #9C3020;
  --ai: #2B4A6F;
  --gold: #B4863C;
  --line: rgba(34,30,26,0.14);

  color: var(--sumi);
  background: var(--washi);
  min-height: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  position: relative;
  overflow-x: hidden;
  box-sizing: border-box;
}
.sc-root * { box-sizing: border-box; }

.sc-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 300px;
  color: var(--sumi);
}
.sc-spin { animation: sc-spin 1s linear infinite; color: var(--shu); }
@keyframes sc-spin { to { transform: rotate(360deg); } }

.sc-waves {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.35;
  background-image: radial-gradient(circle at 0 0, transparent 8px, var(--washi-2) 9px, var(--washi-2) 10px, transparent 11px);
  background-size: 28px 28px;
  background-position: 0 0, 14px 14px;
  mask-image: linear-gradient(to bottom, black, transparent 70%);
}

.sc-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  position: relative;
}
.sc-header-mark {
  width: 44px;
  height: 44px;
  min-width: 44px;
  border-radius: 50%;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15), inset 0 0 0 1px var(--line);
}
.sc-header h1 {
  font-family: 'Shippori Mincho', serif;
  font-weight: 800;
  font-size: 22px;
  margin: 0;
  letter-spacing: 0.5px;
}
.sc-sub {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--ai);
  letter-spacing: 0.5px;
}

.sc-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}
.sc-tab {
  flex: 1;
  padding: 9px 6px;
  border: 1px solid var(--line);
  background: var(--washi-2);
  color: var(--sumi);
  border-radius: 999px;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
}
.sc-tab-active {
  background: var(--sumi);
  color: var(--washi);
  border-color: var(--sumi);
}

.sc-main { position: relative; z-index: 1; }

.sc-card {
  background: #FBF7EE;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px 18px 22px;
  box-shadow: 0 4px 18px rgba(34,30,26,0.06);
}
.sc-card-center { display: flex; flex-direction: column; align-items: center; text-align: center; }

.sc-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--ai);
  font-weight: 700;
  margin: 0 0 6px;
}

.sc-count {
  font-family: 'Shippori Mincho', serif;
  font-size: 64px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 14px;
  color: var(--sumi);
}

.sc-stamp-wrap {
  position: relative;
  width: 170px;
  height: 170px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
  touch-action: manipulation;
}
.sc-plate {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: none;
  background: radial-gradient(circle at 40% 35%, #ffffff, #EDE3CC 78%);
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(34,30,26,0.18), inset 0 0 0 1px var(--line), inset 0 0 0 8px var(--washi);
  transition: transform 0.08s ease;
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.sc-plate:active { transform: scale(0.94); }

.sc-piece-grow {
  display: flex;
  transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
}

.sc-ripple {
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 2px solid var(--shu);
  opacity: 0.7;
  animation: sc-ripple-anim 0.6s ease-out forwards;
  z-index: 1;
}
@keyframes sc-ripple-anim {
  to { transform: scale(1.4); opacity: 0; }
}

.sc-pop {
  position: absolute;
  top: 20%;
  left: 50%;
  transform: translate(-50%, 0);
  font-family: 'Shippori Mincho', serif;
  font-weight: 800;
  font-size: 16px;
  color: var(--shu-dark);
  z-index: 3;
  animation: sc-pop-anim 0.6s ease-out forwards;
  pointer-events: none;
}
@keyframes sc-pop-anim {
  0% { opacity: 1; transform: translate(calc(-50% + var(--pop-x)), 0); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--pop-x)), -34px); }
}

.sc-hint {
  font-size: 12px;
  color: var(--sumi);
  opacity: 0.55;
  margin: 0 0 14px;
}

.sc-types {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
  justify-content: center;
}
.sc-type-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--washi-2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
}
.sc-type-btn-active {
  background: #fff;
  border-color: var(--shu);
  box-shadow: 0 0 0 2px rgba(193,64,42,0.18);
}

.sc-piece-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.sc-piece-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: var(--washi-2);
  border: 1.5px solid transparent;
  border-radius: 14px;
  padding: 12px 6px 10px;
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.12s ease;
}
.sc-piece-card:active { transform: scale(0.96); }
.sc-piece-card-active {
  background: #fff;
  border-color: var(--shu);
  box-shadow: 0 3px 10px rgba(193,64,42,0.18);
}
.sc-piece-card span {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--sumi);
}
.sc-piece-check {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--shu);
  color: var(--washi);
  display: flex;
  align-items: center;
  justify-content: center;
}

.sc-level-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--washi-2);
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ai);
  margin-bottom: 14px;
}

.sc-row-actions { margin-bottom: 12px; }
.sc-minor {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--sumi);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;

.sc-minor:disabled { opacity: 0.35; cursor: default; }

.sc-primary {
  width: 100%;
  display: flex;

  justify-content: center;
  gap: 8px;
  background: var(--ai);

  border: none;

  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;

.sc-primary-sm { padding: 10px 14px; font-size: 14px; margin-top: 4px; }

.sc-divider {
  width: 100%;
  height: 1px;

  margin: 18px 0 14px;
}

.sc-yearline {

  justify-content: space-between;
  align-items: baseline;
  font-size: 14px;
}
.sc-yearline strong { font-family: 'Shippori Mincho', serif; font-size: 18px; color: var(--shu-dark); }

}

.sc-hist-header {

}
.sc-addbtn {
